plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// حذف ملف أيقونة تالف يولّده المحرر أحياناً (drawable/ic_launcher.png)
// الأيقونة الفعلية للتطبيق هي mipmap/ic_launcher
def brokenIcon = file("src/main/res/drawable/ic_launcher.png")
if (brokenIcon.exists()) {
    brokenIcon.delete()
}

android {
    namespace = "com.quwatalan.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.quwatalan.app"
        minSdk = 21
        targetSdk = 21
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
